<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style 3 — Bold & Dramatic</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #0a0a0a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    max-width: 580px;
    width: 100%;
  }
  .step {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #555;
    margin-bottom: 20px;
  }
  h1 {
    font-family: 'Syne', sans-serif;
    font-size: 34px;
    font-weight: 800;
    color: white;
    margin-bottom: 36px;
    line-height: 1.2;
  }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 24px;
    border-radius: 4px;
    border: 1px solid #222;
    cursor: pointer;
    font-size: 15px;
    font-weight: 500;
    color: #aaa;
    transition: all 0.15s;
  }
  .option:hover { border-color: #fff; color: white; }
  .option.selected { border-color: #c8ff00; color: #c8ff00; background: rgba(200,255,0,0.04); }
  .arrow { font-size: 18px; opacity: 0.4; }
  .option.selected .arrow { opacity: 1; }
  .progress {
    display: flex;
    gap: 4px;
    margin-top: 32px;
  }
  .seg { height: 3px; flex: 1; background: #222; border-radius: 2px; }
  .seg.done { background: #c8ff00; }
  .label { font-size: 11px; color: #333; margin-top: 16px; }
</style>
</head>
<body>
  <div class="card">
    <div class="step">Question 02 / 05</div>
    <h1>What does your ideal weekend morning look like?</h1>
    <div class="options">
      <div class="option selected">Sunrise hike or outdoor adventure <span class="arrow">→</span></div>
      <div class="option">Slow coffee and a good book at home <span class="arrow">→</span></div>
      <div class="option">Brunch with a big group of friends <span class="arrow">→</span></div>
      <div class="option">Something creative — market, gallery, new café <span class="arrow">→</span></div>
      <div class="option">Catching up on whatever needs doing <span class="arrow">→</span></div>
    </div>
    <div class="progress">
      <div class="seg done"></div>
      <div class="seg done"></div>
      <div class="seg"></div>
      <div class="seg"></div>
      <div class="seg"></div>
    </div>
    <div class="label">Style 3 — Bold & Dramatic</div>
  </div>
</body>
</html>
