<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style 1 — Playful & Colorful</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #f093fb 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: white;
    border-radius: 24px;
    padding: 40px;
    max-width: 560px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  }
  .badge {
    display: inline-block;
    background: #667eea;
    color: white;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 6px 14px;
    border-radius: 20px;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 28px;
    font-weight: 900;
    color: #1a1a2e;
    margin-bottom: 28px;
    line-height: 1.3;
  }
  .options { display: flex; flex-direction: column; gap: 12px; }
  .option {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    border-radius: 16px;
    border: 2.5px solid #e8e8f0;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 16px;
    font-weight: 700;
    color: #333;
  }
  .option:hover { border-color: #667eea; background: #f0f0ff; }
  .option.selected { border-color: #f093fb; background: #fdf0ff; }
  .emoji { font-size: 24px; }
  .progress {
    margin-top: 28px;
    height: 8px;
    background: #f0f0f5;
    border-radius: 8px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    width: 40%;
    background: linear-gradient(90deg, #667eea, #f093fb);
    border-radius: 8px;
  }
  .label { font-size: 13px; color: #aaa; margin-top: 8px; font-weight: 700; }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">Question 2 of 5</div>
    <h1>What does your ideal weekend morning look like?</h1>
    <div class="options">
      <div class="option selected"><span class="emoji">🏔️</span> Sunrise hike or outdoor adventure</div>
      <div class="option"><span class="emoji">☕</span> Slow coffee and a good book at home</div>
      <div class="option"><span class="emoji">🥐</span> Brunch with a big group of friends</div>
      <div class="option"><span class="emoji">🎨</span> Something creative — market, gallery, new café</div>
      <div class="option"><span class="emoji">📋</span> Catching up on whatever needs doing</div>
    </div>
    <div class="progress"><div class="progress-bar"></div></div>
    <div class="label">Style 1 — Playful & Colorful</div>
  </div>
</body>
</html>
